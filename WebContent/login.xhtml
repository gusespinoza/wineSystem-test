<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:adm="http://github.com/adminfaces"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Marval Wine</title>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<link rel="shortcut icon" type="image/x-icon"
		href="#{resource['favicon/favicon.ico']}" />
	<link rel="shortcut icon" type="image/x-icon"
		href="#{resource['favicon/favicon-16x16.png']}" sizes="16x16" />
	<link rel="shortcut icon" type="image/x-icon"
		href="#{resource['favicon/favicon-32x32.png']}" sizes="32x32" />
	<link rel="shortcut icon" type="image/x-icon"
		href="#{resource['favicon/favicon-96x96.png']}" sizes="96x96" />
	<link rel="manifest" href="/manifest.json" />
	<meta name="theme-color" content="#444" />
	<meta name="mobile-web-app-capable" content="yes" />
	<link rel="shortcut icon" type="image/x-icon"
		href="#{resource['img/marval.ico']}" />
	<h:outputStylesheet library="css" name="styles.css" />
</h:head>

<h:body styleClass="hold-transition login-page">

	<style type="text/css">
.login-logo, .register-logo {
	font-size: 35px !important;
	text-align: center !important;
	margin-bottom: 25px !important;
	font-weight: 300 !important;
}

.vid {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100vh;
	z-index: -1;
}

@media ( min-aspect-ratio : 16/9) {
	.vid {
		width: 100%;
		height: auto;
	}
}

@media ( max-aspect-ratio : 16/9) {
	.vid {
		width: auto;
		height: 100%;
	}
}

@media ( max-width : 767px) {
	.login-box {
		background: url('..img/DSC00905.JPG') center center/cover no-repeat;
	}
	.vid {
		display: none;
	}
}

html, body {
	height: auto;
}
</style>

	<script src="#{resource['js/sweetalert2.all.min.js']}"></script>
	<script src="#{resource['js/push.min.js']}"></script>
	<script src="#{resource['js/aepJS.js']}"></script>

	<div id="loader" class="load-bar" style="display: none">
		<div class="bar"></div>
		<div class="bar"></div>
		<div class="bar"></div>
	</div>

	<div class="cont">
		<span class="text1" style="background: transparent;"><b>Marval</b>Wine System</span>
		<span class="text2"></span>
	</div>

	<div class="login-box ui-flat">

		<div class='vid'>
			<video id="video" autoplay="autoplay" loop="loop"
				style="width: 100%; height: 100%"
				src="#{resource['img/video-corp-01.mp4']}"
				poster="#{resource['img/DSC00905.JPG']}">
			</video>
		</div>


		<div class="login-logo"></div>
		<!-- /.login-logo -->
		<div class="box login-box-body"
			style="-webkit-border-radius: 0px !important; border-radius: 10px !important; opacity: 0.88;">
			<h:form id="loginForm">
				<div class="form-group has-feedback">
					<p:inputText value="#{loginBean.usuario}" id="nombreUsr"
						styleClass="form-control" placeholder="nombre usuario"
						required="true" requiredMessage="ingrese usuario" />
					<i class="fa fa-user form-control-feedback"></i>
				</div>
				<div class="form-group has-feedback">
					<p:inputText value="#{loginBean.password}" type="password"
						id="passUsr" styleClass="form-control" placeholder="contraseña"
						required="true" requiredMessage="ingrese contraseña" />
					<i class="fa fa-lock form-control-feedback"></i>
				</div>
				<div class="form-group has-feedback">
					<p:selectOneMenu id="empresas" value="#{loginBean.empresa}"
						required="true" placeholder="empresa">
s						<f:selectItems value="#{loginBean.empresas}" />
					</p:selectOneMenu>
				</div>
				<div class="row">

					<p:spacer height="10" />
					<div class="col-xs-12">
						<p:commandButton styleClass="btn btn-success btn-block"
							action="#{loginBean.login}" onclick="showBar()" id="botonLogin"
							oncomplete="if(args.validationFailed){hideBar()}" ajax="false"
							value="Ingresar" update="@form" process="@form" />
					</div>
				</div>
			</h:form>
		</div>
		<!-- /.login-box-body -->
	</div>
	<adm:ripple />
	<h:outputScript library="js" name="admintemplate.js" target="head" />

	<style type="text/css">
body .load-bar {
	margin-top: -20px;
}

.swal2-popup {
	font-size: 1.7rem !important;
}
</style>
</h:body>
</html>
