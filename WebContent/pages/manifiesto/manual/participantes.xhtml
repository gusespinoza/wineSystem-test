<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:adm="http://github.com/adminfaces">

<h:head></h:head>
<body>
	<h:form id="blParticipantesForm">
		<h:panelGrid columns="9" cellpadding="5" styleClass="ui-fluid card">
			<h:outputText for="rutPart" value="Rut Adu Pas:  " />
			<p:inputText id="rutPart" value="#{blBean.blParticipante.valorId}" />
			<h:outputText for="nomPart" value="Nombre :  " />
			<p:inputText id="nomPart" value="#{blBean.blParticipante.nombres}" />
			<h:outputText for="direcPart" value="Direccion :  " />
			<p:inputText id="direcPart"
				value="#{blBean.blParticipante.direccion}" />
			<h:outputText for="mailPart" value="Correo :  " />
			<p:inputText id="mailPart" value="#{blBean.blParticipante.email}" />
			<p:selectOneMenu id="tipoPart"
				value="#{blBean.blParticipante.tipoId}" label="tipoPar">
				<!-- 					<p:ajax listener="#{boletosBean.cargaListaParadasPorCiudadFecha()}" update=":viajesF:viajesT" /> -->
				<f:selectItem itemLabel="Seleccione..." itemValue="0" />
				<f:selectItems value="#{blBean.comboTipoParticipante()}"
					var="tipoPa" />
			</p:selectOneMenu>
		</h:panelGrid>
		<p:commandButton id="btn_addBlParticipante" value="Add"
			process="@this" oncomplete="PF('listBlParticipantes').addRow();"
			actionListener="#{blBean.agregarBlParticipante()}" />


		<p:dataTable id="listBlParticipantes"
			value="#{blBean.listaBlParticipanteAux}" var="blPart" type="ordered"
			style="display: inline-block;width:100%">
			<p:autoUpdate />
			<p:column headerText="rut">
				<h:outputText value="#{blPart.valorId}" />
			</p:column>
			<p:column headerText="Nombres">
				<h:outputText value="#{blPart.nombres}" />
			</p:column>
			<p:column headerText="Dirección">
				<h:outputText value="#{blPart.direccion}" />
			</p:column>
			<p:column headerText="Mail">
				<h:outputText value="#{blPart.email}" />
			</p:column>
			<p:column headerText="Tipo">
				<h:outputText value="#{blPart.tipoId}" />
			</p:column>

			<p:column>
				<p:commandLink value=" X " process="listBlParticipantes">
					<p:collector value="#{blPart}"
						removeFrom="#{blBean.listaBlParticipanteAux}" unique="true" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</h:form>
</body>

</html>
