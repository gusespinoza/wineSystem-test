<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:adm="http://github.com/adminfaces">

<h:head>

</h:head>
<body>
	<ui:composition template="/index.xhtml">
		<ui:define name="content-begin">
			<div>
				<ui:insert name="content">
					<p:panel id="panel" header="Subir Programación"
						styleClass="ui-fluid card no-border">
						<h:form id="formTablaXls" enctype="multipart/form-data">
							<p:fileUpload mode="advanced" auto="true" style="font-size: 14px"
								fileUploadListener="#{manifiestoBean.leerExcel}"
								dragDropSupport="true"
								allowTypes="/(\.|\/)(xls|xlsx|XLS|XLSX)$/" sizeLimit="10000000"
								invalidFileMessage="Tipo de archivo invalido"
								fileLimitMessage="Solo se puede subir un archivo a la vez"
								label="Buscar archivo" ajax="false" update="tblManifiesto" />
						</h:form>
					</p:panel>
					<p:spacer />
					<p:panel id="panel2" header="Contenedores cargados"
						styleClass="ui-fluid card no-border">
						<p:messages id="mensajes" closable="true">
							<p:autoUpdate />
						</p:messages>
						<p:dataTable id="tblManifiesto" var="lista"
							value="#{contenedorBean.listarContenedores()}" reflow="true"
							paginator="true" rows="15"
							emptyMessage="No hay contenedores cargados"
							paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
							rowsPerPageTemplate="15,30,45" style="text-align: center;">
							<p:column style="width:50px">
								<p:rowToggler />
							</p:column>
							<p:column headerText="Contenedor" width="150">
								<h:outputText value="#{lista.container}" />
							</p:column>
							<p:column headerText="Nave" width="150">
								<h:outputText value="#{lista.ship}" />
							</p:column>
							<p:column headerText="Viaje">
								<h:outputText value="#{lista.voyage}" />
							</p:column>
							<p:column headerText="Puerto">
								<h:outputText value="#{lista.puerto}" />
							</p:column>
						</p:dataTable>
					</p:panel>
				</ui:insert>
			</div>
		</ui:define>
	</ui:composition>
</body>
</html>
