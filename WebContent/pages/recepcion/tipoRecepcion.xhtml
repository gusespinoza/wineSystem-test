<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:adm="http://github.com/adminfaces"
	xmlns:jsf="http://xmlns.jcp.org/jsf"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

<h:body>

	<ui:composition template="/index.xhtml">

		<ui:define name="content-begin">
			<f:event type="preRenderView"
						listener="#{tipoRecepcionBean.onLoad()}" />

			<div>
				<h:form>
					<p:panel id="selectedRecepcion1" header="Recepción"
						styleClass="card no-border">

						<p:selectOneRadio id="recepcion1"
							value="#{tipoRecepcionBean.tipoRecepcion}"
							valueChangeListener="#{tipoRecepcionBean.cambairValor()}">
							<f:selectItem itemLabel="Axis" itemValue="1"  />
							<f:selectItem itemLabel="Manual" itemValue="2" />
							<p:ajax update="AutoUpdatePanelRecepcion"
								ignoreAutoUpdate="true"></p:ajax>
						</p:selectOneRadio>

					</p:panel>
				</h:form>
			</div>
			<br/>
			<div class="ui-flat" jsf:id="AutoUpdatePanelRecepcion">
				<ui:insert name="content">
					<ui:include src="/pages/recepcion/recepcionAxis.xhtml" />

				</ui:insert>

				<ui:insert name="content2">
					<ui:include src="/pages/recepcion/recepcionManual.xhtml" />

				</ui:insert>
			</div>
		</ui:define>
	</ui:composition>

</h:body>
</html>
