
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:adm="http://github.com/adminfaces">

<h:head>
	<script type="text/javascript">
    PrimeFaces.locales['es'] = {
        closeText: 'Cerrar',
        prevText: 'Anterior',
        nextText: 'Siguiente',
        monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
        monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
        dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
        dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
        dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
        weekHeader: 'Semana',
        firstDay: 1,
        isRTL: false,
        showMonthAfterYear: false,
        yearSuffix: '',
        timeOnlyTitle: 'Sólo hora',
        timeText: 'Tiempo',
        hourText: 'Hora',
        minuteText: 'Minuto',
        secondText: 'Segundo',
        millisecondText: 'Milisegundo',
        currentText: 'Fecha actual',
        ampm: false,
        month: 'Mes',
        week: 'Semana',
        day: 'Día',
        allDayText: 'Todo el día',
        today: 'Hoy',
        clear: 'Claro'
    };
</script>
</h:head>
<body>
	<ui:composition template="/index.xhtml">
		<ui:define name="content-begin">
			<div>
				<ui:insert name="content">
					<h:form id="vinaForm">

						<p:panel id="panel" header="Recepción de carga Axis"
							styleClass="ui-fluid card no-border ">
							<f:event type="preRenderView" listener="#{recepcionBean.onLoad}" />
							<p:panelGrid columns="3" layout="grid"
								contentStyleClass="p-align-baseline ui-fluid">
								<p:selectOneMenu id="menuVinas"
									value="#{recepcionBean.selectedVina}" rendered="true">
									<p:autoUpdate />
									<f:selectItem itemLabel="Seleccione viña..."
										noSelectionOption="false" />
									<f:selectItem itemLabel="VINEDOS EMILIANA"
										itemValue="VINEDOS EMILIANA" />
									<f:selectItem itemLabel="CONCHA Y TORO"
										itemValue="CONCHA Y TORO" />
									<f:selectItem itemLabel="Vina Cono Sur"
										itemValue="Vina Cono Sur" />
									<p:ajax event="change" global="false" />
								</p:selectOneMenu>

								<p:commandButton value="Buscar"
									styleClass="btn btn-success btn-block" icon="fa fa-search"
									actionListener="#{recepcionBean.buscarPo}"
									style="width:100% !important" />
							</p:panelGrid>
						</p:panel>
					</h:form>
					<p:spacer />
					<h:form id="poForm">
						<p:panel id="panelPo" header="Anuncio de carga"
							styleClass="card no-border"
							visible="#{fn:length(recepcionBean.listaPo) gt 0}">

							<p:dataTable id="tblPo" var="po" value="#{recepcionBean.listaPo}"
								rowIndexVar="rowId" paginator="true"
								filteredValue="#{recepcionBean.listaPoAux}"
								emptyMessage="No se encontraron P.O disponibles para recepción"
								widgetVar="tblPoWv" style="text-align: center;" rows="30"
								rowKey="#{po.id}">

								<f:facet name="header">
									<p:panelGrid columns="2" styleClass="ui-noborder"
										id="panelTabla" columnClasses="ui-grid-col-12,ui-grid-col-4"
										style="height:45px;">

										<p:outputPanel style="text-align: right;">
											<p:inputText maxlength="35" autocomplete="off"
												id="globalFilter"
												onkeypress="if(event.keyCode == 13) return false"
												placeholder="Buscar..."
												style="width: 190px;height: 40px;font-size: 16px;">
												<f:ajax event="keyup" delay="800"
													onevent="function(data){if(data.status=='success') PF('tblPoWv').filter();}" />
											</p:inputText>
										</p:outputPanel>
									</p:panelGrid>
								</f:facet>

								<p:column width="20" headerText="#">
									<p:outputLabel value="#{rowId + 1}" />
								</p:column>
								<p:column headerText="PO" width="150" filterBy="#{po.po}"
									filterStyle="display:none" filterMatchMode="contains">
									<h:outputText value="#{po.po}" />
								</p:column>
								<p:column headerText="Orden Ref." width="100"
									filterBy="#{po.orRef}" filterStyle="display:none"
									filterMatchMode="contains">
									<h:outputText value="#{po.orRef}" />
								</p:column>
								<p:column headerText="Cosecha" width="80"
									filterBy="#{po.cosecha}" filterStyle="display:none"
									filterMatchMode="contains">
									<h:outputText value="#{po.cosecha}" />
								</p:column>
								<p:column headerText="Cod. Producto" width="150"
									filterBy="#{po.codProd}" filterStyle="display:none"
									filterMatchMode="contains">
									<h:outputText value="#{po.codProd}" />
								</p:column>
								<p:column headerText="Producto" width="220"
									filterBy="#{po.prod}" filterStyle="display:none"
									filterMatchMode="contains">
									<h:outputText value="#{po.prod}" />
								</p:column>
								<p:column headerText="Unidades Inf." width="100">
									<h:outputText value="#{po.unInf}" />
								</p:column>
								<p:column headerText="Bot x Caja" width="100">
									<h:outputText value="#{po.botCaja}" />
								</p:column>
								<p:column headerText="Ml x Bot" width="100">
									<h:outputText value="#{po.botMl}" />
								</p:column>
								<p:column headerText="Unidades Recep." width="150">
									<h:outputText value="#{po.unRecep}" />
								</p:column>
								<p:column headerText="Acción" width="80">
									<p:commandLink id="agregar"
										actionListener="#{recepcionBean.cargaRecepcion(po.id)}">
										<h:graphicImage
											value="data:image/jpg;base64,#{constantesBean.agregar}"
											width="25" height="25" />
									</p:commandLink>
									<p:tooltip for="agregar" value="Agregar Recepción"></p:tooltip>
								</p:column>
							</p:dataTable>
						</p:panel>
					</h:form>

					<h:form id="recepcionForm">
						<p:dialog widgetVar="rf" modal="true" draggable="false"
							closeOnEscape="true" position="center center" showHeader="false"
							hideEffect="fade" showEffect="fade" resizable="false"
							height="auto" width="80%" closable="false"
							onShow="PF('rf').initPosition();"
							style="background-color:#F0F0F0;" styleClass="box-success">
							<div class="ui-flat">
								<p:panel header="Recepción" styleClass="card no-border"
									id="rfPanel">

									<p:panelGrid columns="6" layout="grid" id="panelManif"
										columnClasses="ui-grid-col-2, ui-grid-col-2, ui-grid-col-2, ui-grid-col-2, ui-grid-col-2, ui-grid-col-2">

										<p:outputLabel style="font-weight:bold; font-size: 15px;"
											value="Purchase Order: #{recepcionBean.selectedPo.purchaseOrderId}" />

										<p:outputLabel style="font-weight:bold; font-size: 15px; "
											value="Producto: #{recepcionBean.selectedPo.productDescription}" />

										<p:outputLabel style="font-weight:bold; font-size: 15px; "
											value="Cosecha: #{recepcionBean.selectedPo.vintage}" />

										<p:outputLabel style="font-weight:bold; font-size: 15px; "
											value="Unidades Informadas: #{recepcionBean.selectedPo.purchaseOrderQuantity}" />

										<p:outputLabel style="font-weight:bold; font-size: 15px; "
											value="Unidades Recepcionadas: #{recepcionBean.totalDetalles}" />

									</p:panelGrid>

									<p:panelGrid id="rfGrid" columns="4"
										columnClasses="ui-grid-col-3,ui-grid-col-3,ui-grid-col-3,ui-grid-col-3"
										layout="grid">

										<p:selectOneMenu id="menuDocs" required="true"
											style="width: 100%" title="Tipo Doc"
											value="#{recepcionBean.selectedDetalle.tipoDoc}"
											rendered="true">
											<p:autoUpdate />


											<f:selectItem itemLabel="TIPO DOC" noSelectionOption="false" />
											<f:selectItems value="#{recepcionBean.documentos}" />
											<p:ajax event="change" global="false" />
										</p:selectOneMenu>

										<p:inputNumber id="numDoc" required="true" decimalPlaces="0"
											style="width: 100%" inputStyle="width: 100%"
											placeholder="NUMERO DOC" title="Numero Doc"
											value="#{recepcionBean.selectedDetalle.numeroDoc}"></p:inputNumber>

										<p:datePicker id="fechaDoc" locale="es" required="true"
											inputStyle="width: 100%"
											value="#{recepcionBean.selectedDetalle.fechaDoc}"
											placeholder="FECHA DOC" title="Fecha Documento"
											showIcon="true" pattern="dd-MMM-yyyy" />

										<p:datePicker id="fechaRec" locale="es" required="true"
											inputStyle="width: 100%"
											value="#{recepcionBean.selectedDetalle.fechaRecepcion}"
											placeholder="FECHA RECEPCIÓN" title="Fecha Recepción"
											showIcon="true" pattern="dd-MMM-yyyy" />


										<p:inputNumber id="cant" required="true" decimalPlaces="0"
											placeholder="CANTIDAD" title="Cantidad"
											inputStyle="width: 100%"
											value="#{recepcionBean.selectedDetalle.cantidad}"></p:inputNumber>


										<p:inputText id="lote" required="true" style="width: 100%"
											onkeyup="value=value.toUpperCase()" placeholder="LOTE"
											value="#{recepcionBean.selectedPo.lote}"
											title="Lote" />

										<p:selectOneMenu id="ss" value="#{recepcionBean.selectedSs}"
											rendered="true" style="width: 100%">
											<f:selectItem itemLabel="SLIPSHEET" noSelectionOption="false" />
											<f:selectItems value="#{recepcionBean.slipSheet}" />
											<p:ajax event="change" global="false" />
										</p:selectOneMenu>

										<p:selectOneMenu id="estado" style="width: 100%"
											required="true"
											value="#{recepcionBean.selectedDetalle.estadoCarga}"
											rendered="true">
											<f:selectItem itemLabel="ESTADO" noSelectionOption="false" />
											<f:selectItems value="#{recepcionBean.estados}" />
											<p:ajax event="change" global="false" />
										</p:selectOneMenu>



										<p:selectOneMenu id="total" style="width: 100%"
											value="#{recepcionBean.totalParcial}" rendered="true">
											<f:selectItem itemLabel="TOTAL" noSelectionOption="false" />
											<f:selectItems value="#{recepcionBean.slipSheet}" />
											<p:ajax event="change" global="false" />
										</p:selectOneMenu>


										<p:inputNumber id="pallet" required="true" decimalPlaces="0"
											placeholder="PALLET" title="PALLET" inputStyle="width: 100%"
											value="#{recepcionBean.selectedDetalle.pallet}"></p:inputNumber>

										<p:inputNumber id="cajaPallet" required="true"
											placeholder="CAJAS POR PALLET" title="CAJAS POR PALLET"
											decimalPlaces="0" inputStyle="width: 100%"
											value="#{recepcionBean.selectedDetalle.cajasPorPallet}"></p:inputNumber>

										<p:inputText id="codF" required="true" style="width: 100%"
											placeholder="CODIGO FERT" title="CODIGO FERT"
											value="#{recepcionBean.selectedPo.codFert}" />

										<p:selectBooleanCheckbox value="#{recepcionBean.selectedRepa}"
											itemLabel="REPALETIZADO" />


									</p:panelGrid>
									<p:spacer height="8" />

									<p:dataTable id="listDetalle"
										value="#{recepcionBean.selectedPo.detalle}" var="detalle"
										type="ordered" emptyMessage="No se han encontrado recepciones"
										style="width:100%;text-align: center;max-height:400px; overflow:auto;">

										<f:facet name="header">
										</f:facet>

										<p:autoUpdate />
										<p:column headerText="Producto" width="100">
											<h:outputText value="#{detalle.descripcionProducto}" />
										</p:column>
										<p:column headerText="Cosecha" width="90">
											<h:outputText value="#{detalle.cosecha}" />
										</p:column>
										<p:column headerText="lote" width="100">
											<h:outputText value="#{detalle.lote}" />
										</p:column>
										<p:column headerText="Cantidad" width="90">
											<h:outputText value="#{detalle.cantidad}" />
										</p:column>
										<p:column headerText="Pallet" width="90">
											<h:outputText value="#{detalle.pallet}" />
										</p:column>
										<p:column headerText="Cajas x Pallet" width="90">
											<h:outputText value="#{detalle.cajasPorPallet} " />
										</p:column>

										<p:column headerText="Acción" width="60">
											<p:commandButton icon="fa fa-minus-square" id="borrar"
												styleClass="btn-danger btn-block btn-xs"
												process="listDetalle"
												actionListener="#{recepcionBean.quitarRecepcion(detalle)}">
											</p:commandButton>
											<p:tooltip for="borrar" value="Quitar"></p:tooltip>

											<p:commandLink id="imp" global="false" process="@this"
												actionListener="#{recepcionBean.impEtiquetas(detalle.etiquetas)}"
												oncomplete="PF('dlgEtiquetas').show();">
												<h:graphicImage
													value="data:image/jpg;base64,#{constantesBean.imprimir}"
													width="25" height="25" />
											</p:commandLink>
											<p:tooltip for="imp" value="Imprimir Etiquetas"></p:tooltip>
										</p:column>

									</p:dataTable>

									<div style="text-align: right;">
										<p:commandButton styleClass="btn btn-success btn-block"
											id="btnAddDetalle" value="Agregar" icon="fa fa-plus"
											update="listDetalle :recepcionForm:rfGrid"
											oncomplete="if (args.validationFailed) validacion();"
											style="width: 150px;height: 35px;"
											disabled="#{recepcionBean.botonAgregar}"
											action="#{recepcionBean.agregarRecepcion()}">
										</p:commandButton>
										<p:spacer width="2" />
										<p:commandButton value="Guardar" icon="fa fa-save"
											id="btnGuardar" styleClass="btn-flat" immediate="true"
											action="#{recepcionBean.guardarRecepcion()}"
											style="width: 150px;height: 35px;">
										</p:commandButton>
										<p:spacer width="2" />
										<p:commandButton value="Cancelar" process="@this"
											action="#{recepcionBean.buscarPo()}" global="false"
											onclick="PF('rf').hide();habilitarScroll();"
											icon="fa fa-close" styleClass="btn btn-flat"
											style="width: 150px;height: 35px;">
											<p:ajax update="vinaForm:panel" />
										</p:commandButton>
									</div>
								</p:panel>
							</div>
						</p:dialog>

					</h:form>

					<h:form id="formEtiquetas">

						<p:dialog widgetVar="dlgEtiquetas" modal="true" draggable="false"
							closeOnEscape="true" position="center center" showHeader="false"
							hideEffect="fade" showEffect="fade" resizable="false"
							height="600px" width="85%" closable="false"
							onShow="PF('dlgEtiquetas').initPosition();"
							style="background-color:#F0F0F0;" styleClass="box-success">

							<div class="ui-flat">

								<p:panel id="etiquetas" styleClass="card no-border">

									<p:repeat var="eti" value="#{recepcionBean.listEtiquetasSel}">

										<p:panel id="etiqueta#{eti.id}" styleClass="card no-border">

											<p:outputPanel style="text-align: center;">
												<p:barcode value="#{eti.qr}" type="qr" width="180"
													height="180" />
											</p:outputPanel>

											<p:spacer height="3"></p:spacer>

											<table style="width: 100%; line-height: 25px;">
												<tr>
													<th style="width: 18%;"><p:outputLabel
															value="Etiqueta:" /></th>
													<th style="width: 25%;"><p:outputLabel
															value="Posición actual:" /></th>
													<th style="width: 18%;"><p:outputLabel
															value="Estado del bulto:" /></th>
													<th style="width: 15%;"><p:outputLabel
															value="Repaletizado:" /></th>
													<th style="width: 13%;"><p:outputLabel value="FERT:" /></th>
													<th style="width: 13%;"><p:outputLabel
															value="Cajas/Pallet:" /></th>
												</tr>
												<tr>
													<td><p:outputLabel
															style="font-weight:bold; font-size: 22px; "
															value="#{eti.nroEtiqueta}" /></td>
													<td><p:outputLabel
															rendered="#{eti.estado eq 'ALMACENADA'}"
															style="font-weight:bold; font-size: 22px; "
															value="Pas #{eti.pasillo} - Pos #{eti.posicion} - Alt #{eti.altura} " /></td>
													<td><p:outputLabel
															style="font-weight:bold; font-size: 22px; margin-right: 10px;"
															value="#{eti.estado}" /></td>
													<td><p:outputLabel
															style="font-weight:bold; font-size: 22px; margin-right: 10px; "
															value="#{(eti.historialRepaletizado.contains('/')) ? 'Si' : 'No'}" /></td>
													<td><p:outputLabel
															style="font-weight:bold; font-size: 22px;"
															value="#{eti.detallePo.po.codFert}" /></td>
													<td><p:outputLabel
															style="font-weight:bold; font-size: 22px; argin-right: 10px; "
															value="#{eti.cajasPallet}" /></td>
												</tr>
											</table>

											<hr />
											<p:spacer height="5"></p:spacer>

											<table style="width: 100%; line-height: 30px;">
												<tr>
													<th style="width: 25%;"><p:outputLabel value="P.O.:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style="font-size: 15px; line-height: 1;width: 100%;"
															value="#{eti.detallePo.po.purchaseOrder}" /></th>

													<th style="width: 25%;"><p:outputLabel
															value="Owner Id:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style=" font-size: 15px; line-height: 1;width: 100%;"
															value="#{eti.detallePo.po.ownerId}" /></th>
												</tr>

												<tr>


													<th style="width: 25%;"><p:outputLabel
															value="Producto:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style="font-weight:bold; font-size: 18px; line-height: 1;width: 100%;"
															value="#{eti.detallePo.descripcionProducto}" /></th>

													<th style="width: 25%;"><p:outputLabel value="Código:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style=" font-size: 15px; line-height: 1;width: 100%;"
															value="#{eti.detallePo.codProducto}" /></th>
												</tr>

												<tr>

													<th style="width: 25%;"><p:outputLabel
															value="Botellas / Caja:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style=" font-size: 15px; line-height: 1;width: 100%;"
															value="#{eti.detallePo.po.bottlesPerUnit}" /></th>

													<th style="width: 25%;"><p:outputLabel
															value="Recepción:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style=" font-size: 15px; line-height: 1;width: 100%;"
															value="#{of:formatDate(eti.detallePo.fechaRecepcion, 'dd-MM-yyyy')}" />
													</th>
												</tr>

												<tr>


													<th style="width: 25%;"><p:outputLabel
															value="Cajas por Pallet:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style=" font-weight:bold; font-size: 18px; line-height: 1;width: 100%"
															value="#{eti.detallePo.cajasPorPallet}" /></th>

													<th style="width: 25%;"><p:outputLabel
															value="Cosecha:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style=" font-size: 15px; line-height: 1;width: 100%;"
															value="#{eti.detallePo.cosecha}" /></th>
												</tr>

												<tr>
													<th style="width: 25%;"><p:outputLabel value="Cc:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style=" font-size: 15px; line-height: 1;width: 100%;"
															value="#{eti.detallePo.po.mlPerBottle}" /></th>

													<th style="width: 25%;"><p:outputLabel value="Lote:" /></th>
													<th style="width: 25%;"><p:outputLabel
															style="font-weight:bold; font-size: 18px; line-height: 1;width: 100%"
															value="#{eti.detallePo.lote}" /></th>
												</tr>
											</table>

										</p:panel>

										<p:spacer height="40"></p:spacer>

									</p:repeat>


								</p:panel>

								<p:spacer height="20"></p:spacer>

								<p:outputPanel style="text-align: right;">
									<p:commandButton styleClass="btn-flat btn-success"
										value="Imprimir" icon="fa fa-print" style="width: 200px;">
										<p:printer target="etiquetas" />
									</p:commandButton>
									<p:commandButton styleClass="btn-flat" update="@form"
										onclick="PF('dlgEtiquetas').hide();" value="Cancelar"
										icon="fa fa-close" style="width: 200px;">

									</p:commandButton>
								</p:outputPanel>

							</div>

						</p:dialog>

					</h:form>

				</ui:insert>
			</div>
		</ui:define>
	</ui:composition>
</body>
</html>
