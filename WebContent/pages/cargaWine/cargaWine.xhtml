<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:adm="http://github.com/adminfaces">

<h:head>

</h:head>
<body>
	<ui:composition template="/index.xhtml">
		<ui:define name="content-begin">
			<div>
				<ui:insert name="content">
					<p:panel id="panel3" header="Carga masiva wine"
						styleClass="card no-border">
						<p:messages id="mensajes1" closable="true">
							<p:autoUpdate />
						</p:messages>

						<h:form id="formTablaXls2" enctype="multipart/form-data">
							<f:event type="preRenderView"
								listener="#{cargaWineBean.onLoad()}" />


							<p:fileUpload mode="advanced" auto="true" style="font-size: 14px"
								fileUploadListener="#{cargaWineBean.leerExcel}"
								dragDropSupport="true"
								allowTypes="/(\.|\/)(xls|xlsx|XLS|XLSX)$/" sizeLimit="10000000"
								invalidFileMessage="Tipo de archivo invalido"
								fileLimitMessage="Solo se puede subir un archivo a la vez"
								label="Buscar archivo" ajax="false" />

						</h:form>

					</p:panel>

				</ui:insert>
			</div>
		</ui:define>
	</ui:composition>
</body>
</html>
