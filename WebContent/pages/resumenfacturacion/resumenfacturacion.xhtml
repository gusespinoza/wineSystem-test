<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:adm="http://github.com/adminfaces"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:pe="http://primefaces.org/ui/extensions">


<h:head>
	<title>Marval AEP</title>
	<link rel="stylesheet" href="style.css"></link>

</h:head>

<h:body id="body">

	<ui:composition template="/index.xhtml">

		<ui:define name="content-begin">
			<p:ajaxStatus onstart="PF('statusDialog').show();"
				onsuccess="PF('statusDialog').hide();" />

			<div class="ui-flat">

				<h:form id="formResumen">

					<f:event type="preRenderView"
						listener="#{resumenFacturacionBean.onLoad()}" />

					<p:panel id="ubicacion" header="Resumen de Facturación"
						styleClass="card no-border">

						<p:panelGrid columns="3" layout="grid"
							columnClasses="ui-grid-col-3,ui-grid-col-3,ui-grid-col-3">

							<p:autoComplete maxlength="30" placeholder="NAVE"
								scrollHeight="200" style="width:100%;"
								onkeyup="value=value.toUpperCase()"
								inputStyle="width:100%!important" forceSelection="true"
								value="#{resumenFacturacionBean.naveSelec}" minQueryLength="3"
								completeMethod="#{resumenFacturacionBean.autoCompletarNaves}"
								effect="fade">
								<p:ajax event="keyup" global="false" />
								<p:ajax event="query" global="false" />
								<p:ajax event="itemSelect" global="false" update="viaje" />
							</p:autoComplete>

							<p:autoComplete maxlength="30" placeholder="VIAJE" id="viaje"
								scrollHeight="200" style="width:100%;"
								onkeyup="value=value.toUpperCase()"
								inputStyle="width:100%!important" forceSelection="true"
								value="#{resumenFacturacionBean.viajeSelec}" minQueryLength="3"
								completeMethod="#{resumenFacturacionBean.autoCompletarViajesNave}"
								effect="fade">
								<p:ajax event="keyup" global="false" />
								<p:ajax event="query" global="false" />
								<p:ajax event="itemSelect" global="false" />
							</p:autoComplete>


							<p:commandButton styleClass="btn btn-success btn-block"
								id="buscar" process="@this" value="Buscar" icon="fa fa-search"
								update="existenciaRes"
								actionListener="#{resumenFacturacionBean.buscarResumen()}">
							</p:commandButton>

						</p:panelGrid>


					</p:panel>

					<br></br>


					<p:panel id="existenciaRes" styleClass="card no-border"
						visible="#{fn:length(resumenFacturacionBean.listaResumen) gt 0}">


						<p:dataTable id="tablaCont" widgetVar="tablaContWV"
							style="text-align: center;" var="cont" rowIndexVar="rowId"
							paginator="false" editable="true"
							emptyMessage="No existen cargas para mostrar."
							value="#{resumenFacturacionBean.listaResumen}" rows="30">
							
							<f:facet name="header">
								<p:panelGrid columns="2" styleClass="ui-noborder"
									id="panelTabla"
									columnClasses="ui-grid-col-10,ui-grid-col-3"
									style="height:45px;">

									<p:outputLabel></p:outputLabel>

									<p:outputPanel style="text-align: right;">

										<p:commandButton styleClass="btn-flat btn-info"
											process="@this"
											disabled="#{!(fn:length(resumenFacturacionBean.listaResumen) gt 0)}"
											actionListener="#{resumenFacturacionBean.calcularResumenNaveViaje()}"
											value="Resumen Facturación Nave/Viaje" icon="fa fa-print" style="width: 260px;">
										</p:commandButton>

									</p:outputPanel>
									
								</p:panelGrid>
							</f:facet>


							<p:column width="20" headerText="#">
								<p:outputLabel value="#{rowId + 1}" />
							</p:column>
							
							<p:column filterBy="#{cont.ship}" headerText="Nave" width="120"
								filterStyle="display:none" filterMatchMode="contains">
								<p:outputLabel
									style="font-weight: 700;font-size: 15px;line-height: 1.0;"
									value="#{cont.ship}" />
							</p:column>
							<p:column filterBy="#{cont.voyage}" headerText="Viaje"
								width="120" filterStyle="display:none"
								filterMatchMode="contains">
								<p:outputLabel
									style="font-weight: 700;font-size: 15px;line-height: 1.0;"
									value="#{cont.voyage}" />
							</p:column>

							<p:column filterBy="#{cont.container}" headerText="Contenedor"
								width="80" filterStyle="display:none" filterMatchMode="contains">
								<p:outputLabel
									style="font-weight: 700;font-size: 15px;line-height: 1.0;"
									value="#{cont.container}" />
							</p:column>
							<p:column filterBy="#{cont.sello}" headerText="Sello" width="80"
								filterStyle="display:none" filterMatchMode="contains">
								<p:outputLabel
									style="font-weight: 700;font-size: 15px;line-height: 1.0;"
									value="#{cont.sello}" />
							</p:column>
							<p:column filterBy="#{cont.tara}" headerText="Tara" width="80"
								filterStyle="display:none" filterMatchMode="contains">
								<p:outputLabel
									style="font-weight: 700;font-size: 15px;line-height: 1.0;"
									value="#{cont.tara}" />
							</p:column>
							
							<p:column headerText="Acción" width="50">
								<p:commandLink id="quit"
									oncomplete="PF('dlgRepaletizado').show();bloquearScroll();"
									process="@this" immediate="true" resetValues="true"
									actionListener="#{resumenFacturacionBean.exportarResumen(cont)}"
									>
									<h:graphicImage
										value="data:image/jpg;base64,#{constantesBean.papeleta}"
										width="25" height="25" />
								</p:commandLink>
								<p:tooltip for="quit" value="Exportar Resumen" />

							</p:column>
							


						</p:dataTable>

					</p:panel>


					<p:commandButton styleClass="btn-flat btn-primary btn-block"
						ajax="false" id="descExcel" style="visibility: hidden;">
						<p:fileDownload value="#{resumenFacturacionBean.generarReporteContenedor()}" />
					</p:commandButton>	
					
					<p:commandButton styleClass="btn-flat btn-primary btn-block"
						ajax="false" id="descExcelNaveViaje" style="visibility: hidden;">
						<p:fileDownload value="#{resumenFacturacionBean.generarReporteNaveViaje()}" />
					</p:commandButton>	



				</h:form>
			</div>

		</ui:define>
	</ui:composition>


</h:body>
</html>
