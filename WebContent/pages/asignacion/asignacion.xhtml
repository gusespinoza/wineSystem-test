<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:adm="http://github.com/adminfaces"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:of="http://omnifaces.org/functions">

<h:head>
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
</h:head>
<body>
	<ui:composition template="/index.xhtml">
		<ui:define name="content-begin">
			<style type="text/css">
.colorgreen {
	background: #00BE5A !important;
	color: #FFFFFF !important;
}

.colorred {
	background: #FF5858 !important;
	color: #FFFFFF !important;
}
</style>
			<div class="ui-flat">
				<h:form id="formBusqueda" enctype="multipart/form-data">

					<f:event type="preRenderView" listener="#{asignacionBean.onLoad()}" />

					<p:panel styleClass="card no-border" id="panel-busqueda"
						header="Asignar Carga">

						<p:messages id="mensajes" for="mensajes" closable="true"
							showDetail="true">

						</p:messages>

						<p:panelGrid columns="5" layout="grid"
							columnClasses="ui-grid-col-3,ui-grid-col-3,ui-grid-col-3,ui-grid-col-3,ui-grid-col-3">

							<p:selectOneMenu id="menuPo" filter="true"
									value="#{asignacionBean.nroPo}" rendered="true">
									<p:autoUpdate />
									<f:selectItem itemLabel="Seleccione Po..." 
										noSelectionOption="false" />
									<f:selectItems value="#{asignacionBean.listaPo}" />
									<p:ajax event="change" global="false" />
								</p:selectOneMenu>
							
							<p:autoComplete id="lote" maxlength="11" placeholder="LOTE"
								inputStyle="width:100%!important"
								onkeyup="value=value.toUpperCase()" style="width:100%!important"
								value="#{asignacionBean.nroLote}" minQueryLength="2"
								completeMethod="#{asignacionBean.autoCompletarLote()}"
								effect="fade">
								<p:ajax event="keyup" global="false" />
								<p:ajax global="false" event="query" />
							</p:autoComplete>
							<p:autoComplete id="fert" maxlength="11" placeholder="COD FERT"
								inputStyle="width:100%!important"
								onkeyup="value=value.toUpperCase()" style="width:100%!important"
								value="#{asignacionBean.codFert}" minQueryLength="2"
								completeMethod="#{asignacionBean.autoCompletarFert()}"
								effect="fade">
								<p:ajax event="keyup" global="false" />
								<p:ajax global="false" event="query" />
							</p:autoComplete>
							<p:commandButton value="Buscar" icon="fa fa-search"
								style="width:100%;" update="panel2"
								actionListener="#{asignacionBean.actualizarTabla()}"
								widgetVar="boton" styleClass="btn btn-success" />

						</p:panelGrid>



						<p:spacer />
					</p:panel>
					<br />
					<p:panel id="panel2" header="Resultados"
						widgetVar="panel-Resultado" styleClass="card no-border"
						visible="#{fn:length(asignacionBean.busquedaEtiqueta) gt 0}">

						<p:toolbar>
							<p:toolbarGroup align="right">
								<p:commandButton id="btnAsignarContenedor" resetValues="true"
									actionListener="#{asignacionBean.cargarContenedores()}"
									global="false" value="Asignar" icon="fa fa-plus"
									styleClass="btn btn-success" process="@this"
									style="width:200px;" />
							</p:toolbarGroup>
						</p:toolbar>

						<br />

						<p:dataTable id="tablaAsignacion" var="etiqueta"
							rowIndexVar="rowIdx" widgetVar="tblAsignacion" global="false"
							value="#{asignacionBean.busquedaEtiqueta}" paginator="false" rows="150"
							emptyMessage="No hay etiquetas asociadas"
							selection="#{asignacionBean.etiquetasSelect}"
							disabledSelection="#{etiqueta.asignado}" rowKey="#{etiqueta.id}"
							rowStyleClass="#{(etiqueta.asignado) ? 'colorgreen' : ''}"
							style="text-align: center;">

							<p:ajax event="toggleSelect" update="@form" />
							<p:ajax event="rowSelectCheckbox" update="@form" />
							<p:ajax event="rowUnselectCheckbox" update="@form" />
							
							<p:column width="10" headerText="#">
								<p:outputLabel value="#{rowIdx + 1}" />
							</p:column>

							<p:column selectionMode="multiple"
								style="width:10px;text-align:center">
							</p:column>
							<p:column headerText="PO" width="20">
								<h:outputText value="#{etiqueta.detallePo.po.purchaseOrderId}" />
							</p:column>
							<p:column headerText="Etiqueta" width="20">
								<h:outputText value="#{etiqueta.nroEtiqueta}" />
							</p:column>
							<p:column headerText="Lote" width="20">
								<h:outputText value="#{etiqueta.detallePo.lote}" />
							</p:column>
							
							<p:column headerText="Cajas" width="20">
								<h:outputText value="#{etiqueta.cajasPallet}" />
							</p:column>
							
							<p:column headerText="Cod. Fert" width="20">
								<h:outputText value="#{etiqueta.detallePo.po.codFert}" />
							</p:column>							
							<p:column headerText="Estado" width="30">
								<h:outputText value="#{etiqueta.estado}" />
							</p:column>
							<p:column headerText="Contenedor" width="50">
								<h:outputText value="#{etiqueta.nroContenedor}" />
							</p:column>
							
						</p:dataTable>
					</p:panel>
				</h:form>

				<h:form id="formDlg">
					<p:dialog showEffect="fade" hideEffect="fade" closable="false"
						showHeader="false" position="center center" resizable="false"
						draggable="false" widgetVar="dlgInfo" modal="true"
						responsive="true" width="700" style="background-color:#F0F0F0;"
						onShow="PF('dlgInfo').initPosition();" styleClass="box-success">

						<p:panel styleClass="card no-border" id="panelDlg"
							header="Asignación Lote N° #{asignacionBean.nroLote}">
							<p:messages id="mensajesDialogo" for="mensajesDialogo"
								closable="true" showDetail="true">
							</p:messages>
							<p:panelGrid columns="3" layout="grid"
								columnClasses="ui-grid-col-3,ui-grid-col-6,ui-grid-col-4">
								<p:outputLabel for="menuContenedor" value="Contenedor" />
								<p:selectOneMenu id="menuContenedor"
									value="#{asignacionBean.selectedIdContenedor}" rendered="true">
									<p:autoUpdate />
									<f:selectItem itemLabel="Seleccione..."
										noSelectionOption="true" />
									<f:selectItems value="#{asignacionBean.contenedores}" />
									<p:ajax event="change" global="false" />
								</p:selectOneMenu>
								<p:commandButton value="Asignar" icon="fa fa-plus"
									id="btnAsignar" immediate="true"
									styleClass="btn btn-block btn-flat btn-primary"
									action="#{asignacionBean.asignarContenedor()}"
									update="mensajesDialogo " />
							</p:panelGrid>
							<br />
							<p:outputPanel style="text-align: left;">
								<p:commandButton value="Guardar" icon="fa fa-check"
									styleClass="btn btn-flat btn-success"
									actionListener="#{asignacionBean.confirmar()}" id="btnGuardar" />
									&nbsp;
								<p:commandButton value="Cancelar" global="false"
									onclick="PF('dlgInfo').hide();habilitarScroll();"
									icon="fa fa-close" styleClass="btn btn-flat" />
							</p:outputPanel>
						</p:panel>

					</p:dialog>
					
										<p:remoteCommand name="guardar" update="@form"
						action="#{asignacionBean.guardarAsignaciones()}" />
					
				</h:form>
			</div>
		</ui:define>

	</ui:composition>
</body>
</html>
