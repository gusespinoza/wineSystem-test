<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

	<ul class="nav navbar-nav">

		<li class="dropdown user user-menu"><a href="#"
			class="dropdown-toggle" data-toggle="dropdown"> <span
				class="hidden-xs"><h:outputText
						value="#{loginBean.usuario} (#{loginBean.rolUser})" /></span>
		</a>
			<ul class="dropdown-menu">
				<li class="user-header">
					<div class="hidden-xs">

						<h:graphicImage url="#{resource['img/Texval.jpg']}"
							rendered="#{loginBean.empresaCompleta eq 'TEXVAL'}"
							style="width: 150px;height: 110px;border-radius: 10%" />
						<h:graphicImage url="#{resource['img/Seaport.jpg']}"
							rendered="#{loginBean.empresaCompleta eq 'SEAPORT'}"
							style="width: 150px;height: 110px;border-radius: 10%" />
						<h:graphicImage url="#{resource['img/marval.png']}"
							rendered="#{loginBean.empresaCompleta eq 'NORTE'}"
							style="width: 150px;height: 110px;border-radius: 10%" />
					</div>
					<p style="color: #fff;">
						<h:outputText value="#{loginBean.usuario} (#{loginBean.username})" />
						<small> #{log} </small>

					</p>
				</li>
				<li class="user-footer"><h:form prependId="false">
						<div class="pull-right ui-flat">
							<p:commandLink id="logout" action="#{loginBean.cierraSession()}"
								title="Cerrar Sesión">
								<i class="fa fa-sign-out fa-2x"></i>
							</p:commandLink>
						</div>
					</h:form></li>
			</ul></li>

	</ul>
</ui:composition>
