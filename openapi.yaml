          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ubicacion/autocomplete/etiquetas-almacenadas:
    get:
      tags:
        - ubicacion
      operationId: autocompleteEtiquetasAlmacenadas
      summary: Autocomplete stored labels
      x-source: "UbicacionBean.autoCompletaEtiquetaAlm(valor)"
