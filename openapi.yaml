  /asignacion/contenedores-disponibles:
    get:
      tags:
        - ubicacion
      operationId: listContenedoresDisponibles
      summary: List containers available for assignment
      x-source: "AsignacionBean.cargarContenedores()"
      x-status: draft
      x-todo: "Confirm the available-container criteria exposed by ContainerService.listarContenedoresDisponibles()."
