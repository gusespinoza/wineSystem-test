        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ubicacion/autocomplete/etiquetas-recibidas:
    get:
      tags:
        - ubicacion
      operationId: autocompleteEtiquetasRecibidas
      summary: Autocomplete received labels
      x-source: "UbicacionBean.autoCompletaEtiquetaRecep(valor)"
      x-status: draft
      x-todo: "Legacy autocomplete returns null on exception; confirm equivalent API error behavior."
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Matching received labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutocompleteItem"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ajuste-inventario/pos:
    get:
      tags:
        - ubicacion
      operationId: searchAjusteInventarioPos
      summary: Search POs for inventory adjustment
      description: Replaces AjusteInventarioBean.buscar(). Uses SP dbo.buscar_pos.
      x-source: "AjusteInventarioBean.buscar()"
      x-status: draft
      x-todo: "Open question: SP dbo.buscar_pos details are not in the source tree. Confirm fields returned."
