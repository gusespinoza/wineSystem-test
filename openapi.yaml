openapi: 3.0.3

info:
  title: wineSystem API
  version: 1.0.0
  description: API designed to decouple the legacy JSF UI from the business logic, allowing Angular and Go to replace the system incrementally.
  license:
    name: Proprietary
    url: https://marval.example.com
  x-migration-phase: "phase-2-contracts"
  x-legacy-system: "wineSystem JSF/Spring/Hibernate"
  x-target-stack: "Angular + Go"

servers:
  - url: /api/v1
    description: Base path for all endpoints (relative, resolved by reverse proxy)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: login / session
    x-source: "LoginBean (DESACOPLE.md#login)"
  - name: mensajes
    description: mensajes procesados / bodega
    x-source: "MensajesProcesadosBean, MensajeBodegaBean"
  - name: existencia
    description: existencia de carga + consulta de etiqueta
    x-source: "ExistenciaCargaBean, BuscarEtiquetaBean"
  - name: ubicacion
    description: reubicacion, asignar ubicacion, ajuste inventario, asignacion
    x-source: "UbicacionBean, AjusteInventarioBean, AsignacionBean"
  - name: recepcion
    description: recepcion axis + manual
    x-source: "RecepcionBean, RecepcionManualBean, TipoRecepcionBean"
  - name: consolidado
    description: tarja + packing list
    x-source: "ConsolidadoBean, PackingListBean"
  - name: despacho
    description: despacho + pt disponibles
    x-source: "DespachoBean, PtDisponiblesBean"
  - name: contenedor
    description: carga de contenedores
    x-source: "ContenedorBean"
  - name: facturacion
    description: resumen de facturacion
    x-source: "ResumenFacturacionBean"
  - name: carga-wine
    description: import de POs desde Excel
    x-source: "CargaWineBean"
  - name: manifiesto
    description: "BLOCKED - do not generate endpoints for this tag yet"
    x-source: "manifiestoBean, blBean (source missing)"

paths:
  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Authenticate a user and return a JWT
      description: Replaces LoginBean.login(). Delegates credential validation to the legacy SEG_USUMARVAL service until Phase 3 (Go) is implemented.
      security: []
      x-source: "LoginBean.login()"
      x-status: draft
      x-todo: "confirm exact request and response contract against the legacy SEG service"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User has no company or permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mensajes-procesados:
    get:
      tags:
        - mensajes
      operationId: listMensajesProcesados
      x-anyOf-required: [po, vina, fechaDesde]
      summary: Search processed messages
      description: Replaces MensajesProcesadosBean.buscarMensajes(). Requires at least one filter (po, vina or fechaDesde) — mirrors the legacy validation.
      x-source: "MensajesProcesadosBean.buscarMensajes()"
      x-status: draft
      x-todo: >-
        Open question: vina and po filters are validated in the bean but NOT
        part of the current DAO SQL. Decide whether the new endpoint fixes
        this or documents it as legacy bug.
      parameters:
        - name: po
          in: query
          required: false
          schema:
            type: string
        - name: vina
          in: query
          required: false
          schema:
            type: string
        - name: fechaDesde
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Processed messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeProcesadoPage"
        "400":
          description: At least one of po, vina or fechaDesde is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing WINE_* permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mensajes-procesados/autocomplete/vinas:
    get:
      tags:
        - mensajes
      operationId: autocompleteVinas
      summary: Autocomplete winery (viña) values
      x-source: "MensajesProcesadosBean.autoCompletarVinas(valor)"
      x-status: draft
      x-todo: "Confirm error behavior; the bean captures exceptions and returns null."
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: Matching winery values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutocompleteItem"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mensajes-procesados/autocomplete/po:
    get:
      tags:
        - mensajes
      operationId: autocompletePO
      summary: Autocomplete PO values
      description: Uses ajuste_inventario.registro_po as source. See x-todo.
      x-source: "MensajesProcesadosBean.autocompletarPO(valor)"
      x-status: draft
      x-todo: >-
        Open question: bean reuses listaVinas for PO (naming bug). Also
        confirm whether the new API should query ajuste_inventario (current)
        or purchase_order (semantically correct).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: Matching PO values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutocompleteItem"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mensajes-procesados/{id}/txt:
    get:
      tags:
        - mensajes
      operationId: downloadMensajeTxt
      summary: Download a processed message as UTF-8 TXT
      x-source: "MensajesProcesadosBean.descargarTXT(MensajeProcesado)"
      x-status: draft
      x-todo: >-
        Open question: ConectaFtp is injected in the bean but unused; current
        download reads directly from MensajeProcesado.texto. Confirm whether
        the new endpoint should proxy an FTP file or keep DB text.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message text
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /existencias:
    get:
      tags:
        - existencia
      operationId: listExistencias
      summary: Search existing cargo by winery/order
      description: Replaces ExistenciaCargaBean.buscarCargas(). Executes SP dbo.existencia_carga.
      x-source: "ExistenciaCargaBean.buscarCargas()"
      x-status: draft
      x-todo: >-
        Open question: SP dbo.existencia_carga internal logic is not documented.
        Confirm what fields it returns and if it handles pagination natively or
        needs it in the API.
      parameters:
        - name: vina
          in: query
          required: false
          schema:
            type: string
        - name: po
          in: query
          required: false
          schema:
            type: string
        - name: orden
          in: query
          required: true
          schema:
            type: string
        - name: fechaDesde
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Existing cargo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistenciaPage"
        "400":
          description: orden is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing WINE_* permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /existencias/autocomplete/vinas:
    get:
      tags:
        - existencia
      operationId: autocompleteVinasExistencia
      summary: Autocomplete winery (viña) values for existencia
      x-source: "ExistenciaCargaBean.autoCompletarVinas(valor)"
      x-status: draft
      x-todo: "Legacy autocomplete returns null on error; confirm equivalent API error behavior."
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Matching winery values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutocompleteItem"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /existencias/autocomplete/pos:
    get:
      tags:
        - existencia
      operationId: autocompletePosExistencia
      summary: Autocomplete PO values for existencia
      x-source: "ExistenciaCargaBean.autocompletarPOS(valor)"
      x-status: draft
      x-todo: "Legacy autocomplete returns null on error; confirm equivalent API error behavior."
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Matching PO values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutocompleteItem"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /existencias/export:
    get:
      tags:
        - existencia
      operationId: exportExistenciasExcel
      summary: Export existing cargo as Excel (.xls)
      description: Replaces generarExcelExistencia(). Generates an Excel file server-side (legacy uses ReporteExcel).
      x-source: "ExistenciaCargaBean.generarExcelExistencia()"
      x-status: draft
      x-todo: "Legacy uses JExcel/POI. Confirm if the new API should generate it on the fly (streaming) or delegate to a background job."
      parameters:
        - name: vina
          in: query
          required: false
          schema:
            type: string
        - name: po
          in: query
          required: false
          schema:
            type: string
        - name: orden
          in: query
          required: true
          schema:
            type: string
        - name: fechaDesde
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Excel file stream
          content:
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing WINE_* permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /etiquetas:
    get:
      tags:
        - existencia
      operationId: searchEtiquetas
      summary: Search labels (consulta de etiqueta)
      description: Replaces BuscarEtiquetaBean.buscarEtiqueta(). Uses a dynamic native query.
      x-source: "BuscarEtiquetaBean.buscarEtiqueta()"
      x-status: draft
      x-todo: "The bean generates QR text in memory. Confirm if the new API should return the QR payload or just the label data."
      parameters:
        - name: nroEtiqueta
          in: query
          required: false
          schema:
            type: string
        - name: vina
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
        - name: numero
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Matching labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultarEtiquetaPage"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /etiquetas/{id}/cancel:
    post:
      tags:
        - existencia
      operationId: cancelEtiqueta
      summary: Cancel a single label
      description: Replaces BuscarEtiquetaBean.cancelarEtiqueta(). Updates label state to CANCELADA with observation and timestamp.
      x-source: "BuscarEtiquetaBean.cancelarEtiqueta()"
      x-status: draft
      x-todo: "Open question: legacy writes directly to estado=CANCELADA. Confirm if audit rules or stock reconciliation are required."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelEtiquetaRequest"
      responses:
        "200":
          description: Label with updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultarEtiqueta"
        "400":
          description: Missing observation or motivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing WINE_* permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Label already cancelled or in a non-cancellable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /etiquetas/cancel-batch:
    post:
      tags:
        - existencia
      operationId: cancelEtiquetasBatch
      summary: Cancel multiple labels in one request
      description: Replaces BuscarEtiquetaBean.cancelarEtiquetasCheck(). Updates all selected labels to CANCELADA.
      x-source: "BuscarEtiquetaBean.cancelarEtiquetasCheck()"
      x-status: draft
      x-todo: "Confirm if the batch should be transactional (all-or-nothing) or best-effort with per-item result."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelEtiquetasBatchRequest"
      responses:
        "200":
          description: Batch cancellation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelEtiquetasBatchResponse"
        "400":
          description: Empty list or missing motivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing WINE_* permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: One or more labels are not cancellable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ubicacion/etiquetas:
    get:
      tags:
        - ubicacion
      operationId: listEtiquetasUbicacion
      summary: Search labels by location or ID
      description: Replaces UbicacionBean.buscar(). Native SQL joining label/PO/detail.
      x-source: "UbicacionBean.buscar()"
      x-status: draft
      x-todo: "Confirm the exact fields returned by the native label/PO/detail query."
      parameters:
        - name: nroEtiqueta
          in: query
          required: false
          schema:
            type: string
        - name: pasillo
          in: query
          required: false
          schema:
            type: string
        - name: altura
          in: query
          required: false
          schema:
            type: string
        - name: posicion
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Labels matching the location or ID filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UbicacionEtiquetaPage"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
